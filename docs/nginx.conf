# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse-proxy config for BintuNet Controller
# Place at: /etc/nginx/sites-available/bintunet
# Then: sudo ln -s /etc/nginx/sites-available/bintunet /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name your-domain.com;          # ← replace with your domain or IP

    # Optional: redirect to HTTPS (uncomment after setting up SSL with certbot)
    # return 301 https://$host$request_uri;

    # Max upload size for logo uploads
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket support (required for /ws)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;   # keep WebSocket connections alive
        proxy_send_timeout  3600s;
    }
}

