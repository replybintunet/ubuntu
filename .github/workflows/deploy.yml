name: Run BintuNet Engine

on:
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install streamlink yt-dlp
          npm install -g localtunnel serve

      - name: Install project dependencies
        run: pnpm install --ignore-scripts

      - name: Build API Server
        env:
          PORT: 8080
          BASE_PATH: /
        run: pnpm --filter @workspace/api-server run build

      - name: Build Frontend
        env:
          PORT: 8080
          BASE_PATH: /
        run: pnpm --filter @workspace/bintunet run build

      - name: Print tunnel password
        run: |
          echo "========================================="
          echo "YOUR TUNNEL PASSWORD IS:"
          curl -s https://loca.lt/mytunnelpassword
          echo ""
          echo "========================================="

      - name: Launch BintuNet & Expose Frontpage
        env:
          PORT: 8080
          NODE_ENV: production
        run: |
          # 1. Start the API server in the background
          node artifacts/api-server/dist/index.mjs &
          
          # 2. Wait for the API server to be ready
          sleep 10
          
          # 3. Serve the frontend and proxy /api requests to the backend
          # The --proxy flag ensures your JSON requests reach the API instead of returning HTML
          serve artifacts/bintunet/dist/public --single --proxy http://localhost:8080 -l 3000 &
          
          # 4. Wait for the frontend server
          sleep 5
          
          # 5. Expose the frontend via localtunnel
          lt --port 3000
