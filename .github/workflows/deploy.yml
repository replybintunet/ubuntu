name: Run BintuNet Engine

on:
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx
          pip install streamlink yt-dlp
          npm install -g localtunnel

      - name: Install project dependencies
        run: pnpm install --ignore-scripts

      - name: Build frontend
        env:
          PORT: 8080
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/bintunet run build

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bintunet-frontend
          path: artifacts/bintunet/dist/public/
          retention-days: 7

      - name: Configure nginx
        run: |
          sudo tee /etc/nginx/sites-available/bintunet > /dev/null <<EOF
          server {
            listen 8080;

            root $GITHUB_WORKSPACE/artifacts/bintunet/dist/public;
            index index.html;

            # Proxy all API calls to the Node backend on port 9090
            location /api {
              proxy_pass http://127.0.0.1:9090;
              proxy_http_version 1.1;
              proxy_set_header Host \$host;
              proxy_set_header X-Real-IP \$remote_addr;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            }

            # Proxy uploaded logo files
            location /uploads {
              proxy_pass http://127.0.0.1:9090;
              proxy_http_version 1.1;
              proxy_set_header Host \$host;
            }
