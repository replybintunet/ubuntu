name: Run BintuNet Engine

on:
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install streamlink yt-dlp
          # Install localtunnel globally to expose the web interface safely
          npm install -g localtunnel

      - name: Install project dependencies
        run: pnpm install --ignore-scripts

      - name: Launch BintuNet & Expose Frontpage
        env:
          PORT: 8080
        run: |
          # 1. Build the API Server
          pnpm --filter @workspace/api-server run build
          
          # 2. Boot up the project in the background (Defaults to port 5173 or 3000)
          pnpm run dev &
          
          # 3. Give the frontend 5 seconds to fully initialize
          sleep 5
          
          # 4. Create an instant public web link for your frontend interface
          # Change 5173 to 3000 if your local UI runs on port 3000
          lt --port 5173
