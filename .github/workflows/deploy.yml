name: Run BintuNet Engine

on:
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx
          pip install streamlink yt-dlp
          npm install -g localtunnel

      - name: Install project dependencies
        run: pnpm install --ignore-scripts

      - name: Build frontend
        env:
          PORT: 8080
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/bintunet run build

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bintunet-frontend
          path: artifacts/bintunet/dist/public/
          retention-days: 7

      - name: Configure and start nginx
        run: |
          # Substitute the actual workspace path into the nginx config file
          sed "s|WORKSPACE_PATH|$GITHUB_WORKSPACE|g" \
            .github/nginx-bintunet.conf \
            | sudo tee /etc/nginx/sites-available/bintunet > /dev/null

          # Enable the site and disable the default
          sudo ln -sf /etc/nginx/sites-available/bintunet /etc/nginx/sites-enabled/bintunet
          sudo rm -f /etc/nginx/sites-enabled/default

          # Verify the config is valid, then start nginx
          sudo nginx -t
          sudo service nginx start
          echo "nginx started on port 8080"

      - name: Print tunnel password
        run: |
          echo "========================================="
          echo "YOUR TUNNEL PASSWORD IS:"
          curl -s https://loca.lt/mytunnelpassword
          echo ""
          echo "========================================="

      - name: Launch API server and expose via localtunnel
        env:
          PORT: 9090
          NODE_ENV: production
        run: |
          # Start the API server on internal port 9090
          # nginx proxies /api, /ws, /uploads to it and serves the frontend on 8080
          node artifacts/api-server/dist/index.mjs &
          sleep 5

          # Start localtunnel and tee its output so we can grep the URL
          lt --port 8080 2>&1 | tee /tmp/lt.log &
          LT_PID=$!

          # Wait up to 30 seconds for the URL to appear
          URL=""
          for i in $(seq 1 15); do
            URL=$(grep -o 'https://[a-zA-Z0-9-]*\.loca\.lt' /tmp/lt.log 2>/dev/null | head -1)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done

          TUNNEL_PASS=$(curl -s https://loca.lt/mytunnelpassword)

          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║           BINTUNET FRONTEND IS LIVE               ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║  URL      : $URL"
          echo "║  Password : $TUNNEL_PASS"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""
          echo "Open the URL above, enter the password when prompted,"
          echo "then log in with the BintuNet admin password."

          # Keep alive until the tunnel closes
