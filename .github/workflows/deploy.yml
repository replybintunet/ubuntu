name: Run BintuNet Engine

on:
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install streamlink yt-dlp

      - name: Install project dependencies
        run: pnpm install --ignore-scripts

      - name: Start Frontend UI and Backend
        run: |
          # This starts your project blocks in the background so the tunnel can catch them
          pnpm --filter @workspace/api-server run build
          pnpm run dev & 
        env:
          PORT: 8080

      - name: Create Access Link
        # This opens a secure window into the runner machine
        uses: mxschmitt/action-tmate@v3
