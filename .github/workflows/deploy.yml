name: Run BintuNet Engine

on:
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install streamlink yt-dlp
          npm install -g localtunnel serve

      - name: Install project dependencies
        run: pnpm install --ignore-scripts

      - name: Build API Server
        env:
          PORT: 8080
          BASE_PATH: /
        run: pnpm --filter @workspace/api-server run build

      - name: Build Frontend
        env:
          PORT: 8080
          BASE_PATH: /
        run: pnpm --filter @workspace/bintunet run build

      - name: Print tunnel password
        run: |
          echo "========================================="
          echo "YOUR TUNNEL PASSWORD IS:"
          curl -s https://loca.lt/mytunnelpassword
          echo ""
          echo "========================================="

      - name: Launch BintuNet & Expose Frontpage
        env:
          PORT: 8080
          NODE_ENV: production
        run: |
          # Start the API server on port 8080
          node artifacts/api-server/dist/index.mjs &

          # Serve the built frontend static files on port 3000
          serve artifacts/bintunet/dist/public --single -l 3000 &

          # Wait for servers to initialize
          sleep 5

          # Expose the frontend
          lt --port 3000
