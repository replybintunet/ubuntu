name: Run BintuNet Engine

on:
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install streamlink yt-dlp
          npm install -g localtunnel

      - name: Install project dependencies
        run: pnpm install --ignore-scripts

      - name: Launch BintuNet & Expose Frontpage
        env:
          PORT: 8080
          BASE_PATH: /
        run: |
          # 1. Build the API Server backend
          pnpm --filter @workspace/api-server run build
          
          # 2. Boot up ONLY the frontend application workspace in the background
          pnpm --filter @workspace/bintunet run dev &
          
          # 3. Give the frontend development server 5 seconds to fully boot up
          sleep 5
          
          # 4. Print the exact Tunnel Password you need for the web link
          echo "========================================="
          echo "YOUR TUNNEL PASSWORD IS:"
          curl -s https://loca.lt/mytunnelpassword
          echo ""
          echo "========================================="
          
          # 5. Create an instant public web link matching the Vite port (8080)
          lt --port 8080
